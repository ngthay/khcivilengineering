<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2fb"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a95ff"/>
      <stop offset="1" stop-color="#1c40cf"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9db8ff"/>
      <stop offset="1" stop-color="#4a72ee"/>
    </linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cf7"/>
      <stop offset="1" stop-color="#16339f"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#1c40cf" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- White tile (the sidebar rounds its corners) -->
  <rect width="64" height="64" fill="url(#bg)"/>

  <g filter="url(#drop)">
    <!-- Book 1 -->
    <rect x="12" y="17" width="10" height="33" rx="1.8" fill="url(#b1)"/>
    <rect x="12" y="22" width="10" height="2.2" fill="#fff" fill-opacity=".85"/>
    <rect x="12" y="43" width="10" height="2.2" fill="#fff" fill-opacity=".85"/>
    <!-- Book 2 -->
    <rect x="23.5" y="21" width="8.5" height="29" rx="1.8" fill="url(#b2)"/>
    <rect x="25.6" y="26" width="4.3" height="7" rx="1" fill="#fff" fill-opacity=".9"/>
    <!-- Book 3 -->
    <rect x="33.5" y="14" width="10" height="36" rx="1.8" fill="url(#b3)"/>
    <rect x="33.5" y="19" width="10" height="2.2" fill="#fff" fill-opacity=".85"/>
    <rect x="33.5" y="23.2" width="10" height="1.2" fill="#fff" fill-opacity=".6"/>
    <rect x="33.5" y="43" width="10" height="2.2" fill="#fff" fill-opacity=".85"/>
    <!-- Book 4, leaning on book 3 -->
    <g transform="rotate(16 54 50)">
      <rect x="45.5" y="21" width="8.5" height="29" rx="1.8" fill="url(#b1)"/>
      <rect x="45.5" y="26" width="8.5" height="2" fill="#fff" fill-opacity=".85"/>
    </g>
    <!-- Shelf -->
    <rect x="8" y="49.5" width="48" height="4.5" rx="2.2" fill="#1c40cf"/>
  </g>
</svg>
