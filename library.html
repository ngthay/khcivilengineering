<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KCE Library</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles: same as the home page, plus library.css -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/widgets.css">
  <link rel="stylesheet" href="css/library.css">
</head>
<body>
  <div class="app">

    <!-- ===== Left sidebar ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg width="28" height="22" viewBox="0 0 28 22" fill="currentColor" aria-hidden="true">
          <rect width="28" height="4" rx="2"/><rect y="9" width="22" height="4" rx="2"/><rect y="18" width="28" height="4" rx="2"/>
        </svg>
        KCE
      </div>
      <!-- Menu links are built from js/data.js -->
      <nav class="nav" id="nav"></nav>
    </aside>

    <!-- ===== Main content ===== -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <input type="search" id="search" placeholder="Search books..." aria-label="Search books">
        </label>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
          </button>
          <button class="icon-btn" aria-label="Notifications">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
            </svg>
          </button>
          <div class="avatar" aria-hidden="true">E</div>
        </div>
      </header>

      <!-- Banner -->
      <section class="lib-hero">
        <h1>📚 Library</h1>
        <p id="bookCount"></p>
      </section>

      <!-- Shelf filters + books, built from js/books.js -->
      <section class="panel library">
        <div class="lib-toolbar">
          <div class="shelves" id="shelves"></div>
          <div class="view-toggle" role="group" aria-label="View">
            <button data-view="grid" aria-label="Icon view" title="Icon view">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/>
                <rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>
              </svg>
            </button>
            <button data-view="list" aria-label="List view" title="List view">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
                <path d="M9 6h12M9 12h12M9 18h12"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="books"></div>
        <p class="empty" id="empty"></p>
      </section>
    </main>
  </div>

  <!-- Scripts: data first, then the code that uses it -->
  <script src="js/data.js"></script>
  <script src="js/books.js"></script>
  <script src="js/app.js"></script>
  <script src="js/library.js"></script>
</body>
</html>
