<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KhmerCivilEngineer</title>

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles: variables first, because the other files use them -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/widgets.css">
</head>
<body>
  <div class="app">

    <!-- ===== Left sidebar ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <svg width="28" height="22" viewBox="0 0 28 22" fill="currentColor" aria-hidden="true">
          <rect width="28" height="4" rx="2"/><rect y="9" width="22" height="4" rx="2"/><rect y="18" width="28" height="4" rx="2"/>
        </svg>
        KCE
      </div>
      <!-- Menu links are built from js/data.js -->
      <nav class="nav" id="nav"></nav>
    </aside>

    <!-- ===== Main content ===== -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button>
        <label class="search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
          </svg>
          <input type="search" id="search" placeholder="Search..." aria-label="Search subjects">
        </label>
        <div class="top-actions">
          <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Hero banner -->
      <!-- Background photo (books, glasses and shelf) is set in css/dashboard.css -->
      <section class="hero">
        <div class="hero-text">
          <h1>Hi, Engineer</h1>
          <p>A library of formulas for civil engineers, from dynamics and mechanics to concrete, steel, geotechnics and coding.</p>
          <a class="btn-ghost" href="#subjects">Learn more</a>
        </div>
      </section>

      <div class="content">
        <!-- Subject cards: sections are built from js/data.js -->
        <div class="panel" id="subjects">
          <div id="sections"></div>
          <p class="empty" id="empty">No subjects match your search.</p>
        </div>

        <!-- ===== Right sidebar (widgets) ===== -->
        <div class="aside">
          <div class="panel">
            <div class="widget-head">
              <h2>Study progress</h2>
              <button class="toggle" id="progressToggle" aria-pressed="true" aria-label="Show progress"></button>
            </div>
            <p class="sub">Open each subject to complete it!</p>
            <!-- One bar per section, built from js/data.js -->
            <div id="progressBody"></div>
          </div>

          <div class="panel">
            <h2>Quick Links</h2>
            <!-- Built from js/data.js -->
            <div id="links"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts: data first, then the code that uses it -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
